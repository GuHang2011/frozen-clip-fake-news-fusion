# configs/politifact_smoke.yaml

dataset:
  csv: data/processed/politifact.csv
  dataset_name: politifact
  max_samples: 100
  val_ratio: 0.2

model:
  clip_model_name: openai/clip-vit-large-patch14-336
  class_names:
    - real
    - fake
  hidden_dim: 768
  prompt_length: 16
  prompt_init_std: 0.02
  coattention_heads: 4
  coattention_dropout: 0.1
  coattention_ffn_dim: 2048
  classifier_temperature: 0.07
  freeze_clip: true
  use_knowledge: true
  knowledge_bank_size: 64
  top_k_text: 5
  top_k_image: 5

training:
  output_dir: outputs/politifact_config
  epochs: 3
  batch_size: 1
  lr: 0.00003
  weight_decay: 0.001
  seed: 42
  device: cpu