name: Recompute saved-prediction analysis

on:
  push:
  pull_request:

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependency
        run: python -m pip install -r requirements-analysis.txt
      - name: Recompute analysis outputs
        env:
          P2R: results
        run: |
          python analysis/analyze.py results out
          python analysis/analyze2.py out
          python analysis/analyze3.py out
